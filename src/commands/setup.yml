---
description: Create a standard user account to run steps with
parameters:
  username:
    description: The username for the standard user account
    default: distiller-restricted
    type: string
  passlist_file:
    description: |
      Absolute location of a passlist file containing IP addresses
      to allow, one per line
    type: string
  grant_project_access:
    description: |
      Grant the restricted user read/write/execute access to the project
      directory (CIRCLE_WORKING_DIRECTORY). This is required for the
      restricted user to access checked-out code and dependencies.
    type: boolean
    default: true
steps:
  - run:
      name: Platform check
      command: <<include(scripts/platform_check.sh)>>
  - run:
      name: Create User
      environment:
        PARAM_USERNAME: <<parameters.username>>
      command: <<include(scripts/create_user.sh)>>
  - run:
      name: Setup PF configuration
      environment:
        PARAM_USERNAME: <<parameters.username>>
        PARAM_PASSLIST: <<parameters.passlist_file>>
      command: <<include(scripts/setup_pf.sh)>>
  - run:
      name: Enable PF Firewall
      command: <<include(scripts/enable.sh)>>
  - when:
      condition: <<parameters.grant_project_access>>
      steps:
        - run:
            name: Grant project directory access
            environment:
              PARAM_USERNAME: <<parameters.username>>
            command: <<include(scripts/grant_project_access.sh)>>
